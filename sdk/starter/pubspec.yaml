name: pocketrun_starter
description: "Plugins preloaded into PocketRun (managed by `pocketrun sdk add`)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  # pocketrun-starter:packages
  audioplayers: 6.7.1
  camera: 0.12.0+2
  connectivity_plus: 7.3.1
  device_info_plus: 13.3.0
  flutter_local_notifications: 22.3.3
  flutter_secure_storage: 11.2.0
  flutter_tts: 4.2.5
  just_audio: 0.10.6
  mobile_scanner: 7.4.2
  sensors_plus: 7.1.1
  speech_to_text: 7.4.0
  video_player: 2.11.1
  wakelock_plus: 1.7.0
  webview_flutter: 4.14.1
  # pocketrun-starter:pins (PocketRun's existing versions; keeps them unchanged)
  android_file_picker: 2.1.1
  flutter_plugin_android_lifecycle: 2.0.35
  geocoding_android: 5.0.2
  geolocator_android: 5.2.1
  image_picker_android: 0.8.13+17
  jni: 1.1.0
  jni_flutter: 1.0.4+1
  package_info_plus: 10.2.2
  path_provider_android: 2.3.1
  permission_handler_android: 13.0.1
  share_plus: 13.3.1
  shared_preferences_android: 2.4.23
  sqflite_android: 2.4.2+3
  url_launcher_android: 6.3.30
  # pocketrun-starter:end

flutter:
  uses-material-design: true
