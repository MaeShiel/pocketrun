name: pocketrun
description: "Runs Flutter projects from your PC on your phone without installing them."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

# The PocketRun SDK: the Android side of every plugin a project can use inside PocketRun, pinned to
# the exact versions the registered projects resolve to. Only the native implementation packages
# are listed (e.g. geolocator_android, not geolocator); the Dart side comes from the project itself.
dependencies:
  flutter:
    sdk: flutter
  # pocketrun-sdk:begin (generated by `pocketrun sdk sync`; do not edit by hand)
  android_file_picker: 2.1.1
  audio_session: 0.2.4
  audioplayers_android: 5.2.1
  camera_android_camerax: 0.7.2
  connectivity_plus: 7.3.1
  device_info_plus: 13.3.0
  flutter_local_notifications: 22.3.3
  flutter_plugin_android_lifecycle: 2.0.35
  flutter_secure_storage: 11.2.0
  flutter_tts: 4.2.5
  geocoding_android: 5.0.2
  geolocator_android: 5.2.1
  image_picker_android: 0.8.13+17
  jni: 1.1.0
  jni_flutter: 1.0.4+1
  just_audio: 0.10.6
  mobile_scanner: 7.4.2
  package_info_plus: 10.2.2
  path_provider_android: 2.3.1
  permission_handler_android: 13.0.1
  sensors_plus: 7.1.1
  share_plus: 13.3.1
  shared_preferences_android: 2.4.23
  speech_to_text: 7.4.0
  sqflite_android: 2.4.2+3
  url_launcher_android: 6.3.30
  video_player_android: 2.9.5
  wakelock_plus: 1.7.0
  webview_flutter_android: 4.12.0
  # pocketrun-sdk:end

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
